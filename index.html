const slides=[{"n": 1, "raw": ["FROM MODELS TO ACTION", "AI AGENTIC HARNESS", "The invisible system that turns a powerful model into a useful AI agent.", "LEVEL 100"], "notes": "0:00–1:00. Introduce Fiqri Ismail (Microsoft MVP for Developer Technologies and Power Apps), invite attendees to connect on LinkedIn, then ask: When you use a coding assistant, what actually reads files and runs tests? Introduce the key distinction."}, {"n": 2, "raw": ["AI AGENTIC HARNESS", "Start with a question", "Can an AI model fix a bug in your application by itself?", "02", "Understand the bug", "Open source files", "Run tests", "A good answer is not the same as a completed action."], "notes": "1:00–3:00. Invite hands: Which boxes require real-world actions? All can be part of a workflow but reading files and testing requires external execution."}, {"n": 3, "raw": ["AI AGENTIC HARNESS", "Today’s learning journey", "A simple, practical route from model to working agent.", "03", "01", "Model ≠ Agent", "02", "Harness anatomy", "03", "Tools + Memory", "04", "The agentic loop", "05", "A coding walkthrough", "06", "Safety + Q&A"], "notes": "3:00–4:00. Explain that this is conceptual rather than a framework-specific tutorial."}, {"n": 4, "raw": ["AI AGENTIC HARNESS", "A language model is not the whole application", "The model produces text or structured outputs from supplied inputs.", "04", "Prompt + Context", "AI MODEL", "Response", "It can suggest a shell command. Another piece of software must execute it."], "notes": "4:00–5:30. Clarify raw models do not independently access files or persistent memory. An application supplies input and acts on tool requests."}, {"n": 5, "raw": ["AI AGENTIC HARNESS", "Meet the agentic harness", "The software surrounding the model turns reasoning into controlled execution.", "05", "AGENTIC HARNESS", "AI MODEL", "Instructions", "Tools", "Memory", "Runtime • Rules • Verification"], "notes": "5:30–7:30. Describe harness as application runtime, not another model. Analogy: pilot versus aircraft systems, navigation and controls."}, {"n": 6, "raw": ["AI AGENTIC HARNESS", "Model vs. harness", "Different responsibilities. Both are necessary.", "06", "THE MODEL", "THE HARNESS", "•  Interprets the task", "•  Chooses a next step", "•  Generates tool requests", "•  Interprets results", "•  Provides instructions + context", "•  Executes allowed tools", "•  Preserves state and memory", "•  Enforces limits and approvals"], "notes": "7:30–9:00. Stress that exact responsibility boundaries differ by product. The model requests a tool call; code outside the model performs it."}, {"n": 7, "raw": ["INSIDE THE HARNESS", "Tools: let the agent act", "Build the architecture — component 1 of 3.", "07", "AI MODEL", "TOOLS", "MEMORY", "LOOP", "Execute allowed actions"], "notes": "9:00–10:30 Animation by progressive slide reveal. Explain component 1: Tools: let the agent act."}, {"n": 8, "raw": ["INSIDE THE HARNESS", "Memory: keep useful information", "Build the architecture — component 2 of 3.", "08", "AI MODEL", "TOOLS", "MEMORY", "LOOP", "Preserve relevant state"], "notes": "10:30–12:00 Animation by progressive slide reveal. Explain component 2: Memory: keep useful information."}, {"n": 9, "raw": ["INSIDE THE HARNESS", "Loop: continue until done", "Build the architecture — component 3 of 3.", "09", "AI MODEL", "TOOLS", "MEMORY", "LOOP", "Repeat, check, stop safely"], "notes": "10:30–12:00 Animation by progressive slide reveal. Explain component 3: Loop: continue until done."}, {"n": 10, "raw": ["AI AGENTIC HARNESS", "Tools = capabilities", "The model asks. The harness executes.", "10", "FILES", "Read source code", "TERMINAL", "Run a command", "SEARCH", "Find information", "API", "Call a service", "A tool is real executable functionality—not a magical power of the model."], "notes": "12:00–14:00. Show concrete coding-assistant examples: read file, run tests, invoke REST API. Tool inputs and permissions matter."}, {"n": 11, "raw": ["AI AGENTIC HAR
